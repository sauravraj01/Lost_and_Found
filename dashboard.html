<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Lost & Found Portal</h1>
        <h2>Student Dashboard</h2>

        <div class="profile">
            <label><strong>Name :</strong> <span id="studentName"></span></label>
            <input type="text" id="name">

            <label><strong>Campus :</strong> <span id="studentCampus"></span></label>
            <input type="text">

            <label><strong>Contact :</strong> <span id="studentContact"></span></label>
            <input type="text" id="contact">

            <label><strong>Enrollment :</strong> <span id="studentEnrollment"></span></label>
            <input type="text" id="enroll">

        </div>

        <div class="card-container">

            <div class="card">

                <h3>Lost Item</h3>

                <p>Report an item you have lost.</p>

                <button onclick="window.location='lost.html'">
                    Report Lost Item
                </button>

            </div>

            <div class="card">

                <h3>Found Item</h3>

                <p>Report an item you have found.</p>

                <button onclick="window.location='found.html'">
                    Report Found Item
                </button>

            </div>

        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
