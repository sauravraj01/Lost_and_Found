<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt | Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="bg-decor" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
        <span class="blob blob-d"></span>
        <span class="shape shape-ring"></span>
        <span class="shape shape-ring-sm"></span>
        <span class="shape shape-square"></span>
        <span class="shape shape-diamond"></span>
        <span class="shape shape-dots"></span>
        <span class="shape shape-dots-b"></span>
    </div>

    <!-- ==================== Navbar ==================== -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">Find<span class="it">IT</span></a>

        <div class="nav-search">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input
                type="search"
                id="searchInput"
                placeholder="Search items, names, descriptions..."
                aria-label="Search items"
            >
        </div>

        <div class="nav-right">
            <button class="btn-theme" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle dark and light theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <button class="btn-report" id="reportBtn" type="button">Report (Lost / Found)</button>

            <div class="profile-menu">
                <button class="btn-profile" id="profileBtn" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="profile-avatar" id="profileAvatar">G</span>
                    <span class="profile-name" id="navUser">Guest</span>
                    <svg class="profile-caret" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m6 9 6 6 6-6"></path>
                    </svg>
                </button>
                <div class="profile-dropdown" id="profileDropdown" hidden>
                    <p class="profile-email" id="profileEmail"></p>
                    <button class="btn-logout" id="logoutBtn" type="button">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="page">
        <header class="page-header" id="pageHeader">
            <div class="page-header-text">
                <h1>Welcome, <span id="welcomeName">Guest</span></h1>
                <p>Browse the campus board or report something you lost or found.</p>
            </div>
        </header>

        <section class="board" id="board">
            <div class="toolbar" id="itemsSection">
                <div class="toolbar-row">
                    <div class="chip-group" id="filterGroup" role="group" aria-label="Filter">
                        <button class="chip active" type="button" data-filter="all" title="All items">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                            <span>All</span>
                        </button>
                        <button class="chip" type="button" data-filter="lost" title="Lost only">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="m8 8 6 6"/><path d="m14 8-6 6"/></svg>
                            <span>Lost</span>
                        </button>
                        <button class="chip" type="button" data-filter="found" title="Found only">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                            <span>Found</span>
                        </button>
                        <button class="chip" type="button" data-filter="matched" title="Has match">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            <span>Match</span>
                        </button>
                    </div>

                    <label class="sort-select-wrap" title="Sort">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M20 8h-5"/><path d="M15 10V6.5a2.5 2.5 0 0 1 5 0V10"/><path d="M15 14h5l-5 6h5"/></svg>
                        <select id="sortSelect" aria-label="Sort items">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                            <option value="az">A → Z</option>
                            <option value="za">Z → A</option>
                        </select>
                    </label>
                </div>
            </div>

            <div class="items-section" id="lostSection">
                <div class="section-header">
                    <h2>Lost Items</h2>
                    <span class="count-badge" id="lostCount">0</span>
                </div>
                <div id="reportsContainer" class="cards-grid"></div>
                <p class="empty-msg" id="lostEmpty" hidden>No lost items match your search.</p>
            </div>

            <div class="items-section" id="foundSection">
                <div class="section-header">
                    <h2>Found Items</h2>
                    <span class="count-badge" id="foundCount">0</span>
                </div>
                <div id="foundContainer" class="cards-grid"></div>
                <p class="empty-msg" id="foundEmpty" hidden>No found items match your search.</p>
            </div>
        </section>
    </main>

    <!-- ================= Report Modal (Lost / Found tabs) ================= -->
    <div class="modal1" id="reportModal">
        <div class="report">
            <div class="report-inner">
                <div class="report-header">
                    <h3 class="modal-title">New Report</h3>
                    <button class="modal-close" id="reportClose" type="button" aria-label="Close">✖</button>
                </div>

                <div class="report-tabs" role="tablist">
                    <button class="report-tab active" id="tabLost" type="button" role="tab" aria-selected="true">Lost</button>
                    <button class="report-tab" id="tabFound" type="button" role="tab" aria-selected="false">Found</button>
                </div>

                <div class="report-panel" id="lostPanel" role="tabpanel">
                    <label for="names">Name</label>
                    <input id="names" type="text" placeholder="Your name">

                    <label for="item">Item</label>
                    <input id="item" type="text" placeholder="What did you lose?">

                    <label for="lostDescription">Description</label>
                    <textarea id="lostDescription" rows="4" placeholder="Color, location, time..."></textarea>

                    <label for="image">Upload image</label>
                    <input type="file" id="image" accept="image/*">

                    <img id="preview" alt="Preview" hidden>

                    <button class="submit" id="submit" type="button">Submit Lost Report</button>
                </div>

                <div class="report-panel" id="foundPanel" role="tabpanel" hidden>
                    <label for="foundNames">Name</label>
                    <input id="foundNames" type="text" placeholder="Your name">

                    <label for="foundItem">Item</label>
                    <input id="foundItem" type="text" placeholder="What did you find?">

                    <label for="foundDescription">Description</label>
                    <textarea id="foundDescription" rows="4" placeholder="Color, location, time..."></textarea>

                    <label for="foundImage">Upload image</label>
                    <input type="file" id="foundImage" accept="image/*">

                    <img id="foundPreview" alt="Preview" hidden>

                    <button class="submit" id="foundSubmit" type="button">Submit Found Report</button>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
