<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Found Item</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Report Found Item</h1>

        <form id="foundForm">

            <label>Item Name</label>
            <input type="text" id="foundItem">

            <label>Finder Name</label>
            <input type="text" id="finderName">

            <label>Contact Number</label>
            <input type="text" id="finderContact">

            <label>Location Found</label>
            <input type="text" id="location">

            <label>Description</label>
            <textarea id="foundDescription" rows="5"></textarea>

            <label>Upload Item Photo</label>
            <input type="file" id="foundPhoto">

            <button type="submit">Submit Report</button>

        </form>

        <p id="foundMessage"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
