<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>
    <link rel="stylesheet" href="dashboard.css">
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">

    
    <!-- ==================== Navbar ==================== -->
    <nav class="navbar">
        <div class="nav-left">
            <h1>Find<span class="it">IT</span></h1>
        </div>
    </nav>

    <h1>Welcome !! </h1>
    <h3>xyzzz </h3>

    <button class="lost" id="lost">
        Lost Something ??
    </button>
    
    <button class="found" id="found">
        Found Something !!
    </button>

    <div class="modal1" id="modal1">
        
    <div class="report">
        

        <div class="report-content">
        <label>Name</label><br>
        <input id="names" type="text"><br>

        <label>Item</label><br>
        <input id="item" type="text"><br>

        
        <label>Description</label><br>
        <textarea id="lostDescription"></textarea><br>

        <label>Upload image</label><br>
        <input type="file" id="image" accept="image/*"><br>

        <img id="preview" width="250">

        <button class="submit" id="submit">Submit</button>

        </div>
        <div class="closemodal">
            <button id="close">✖</button>
        </div>
    </div>
    </div>


    <!-- ================= Found Modal ================= -->

    <div class="modal1" id="foundModal">
        
        <div class="report">

            <div class="report-content">

                <label>Name</label><br>
                <input id="foundNames" type="text"><br>

                <label>Item</label><br>
                <input id="foundItem" type="text"><br>

                <label>Description</label><br>
                <textarea id="foundDescription"></textarea><br>

                <label>Upload image</label><br>
                <input type="file" id="foundImage" accept="image/*"><br>

                <img id="foundPreview" width="250">

                <button class="submit" id="foundSubmit">
                    Submit
                </button>

            </div>


            <div class="closemodal">
                <button id="foundClose">
                    ✖
                </button>
            </div>

        </div>

    </div>

    <h2>LOST ITEMS </h2>
    <div id="reportsContainer"></div>

    <h2>FOUND ITEMS</h2>
    <div id="foundContainer"></div>

    <script src="dashboard.js"></script>

</body>

</html>
