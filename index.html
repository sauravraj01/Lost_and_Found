<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt | Login</title>

    <link rel="stylesheet" href="indexcs.css">
</head>
<body>

    <!-- ==================== Navbar ==================== -->
    <nav class="navbar">
        <div class="nav-left">
            <h1>Find<span class="it">IT</span></h1>
        </div>


    </nav>


    <!-- ==================== Main Container ==================== -->
    <main class="container">

        <!-- ========== Left Section ========== -->
        <section class="left-section">

            <!-- Logo + Heading -->
            <div class="left-top">
                <h1 id="head1">Lost Something on Campus?</h1>

                <p id="subhead1">
                    Sign in to report missing items, browse recent findings,<br><br>
                    and reconnect with your belongings through the campus community.
                </p>

            </div>

            <!-- Login Form -->
            <div class="left-bottom">

                <form class="login-form">

                    <div class="input-group">
                        <label>Email</label><br>
                        <input class="input" id="maillogin" type="email"><br><br>

                        <label>Contact No.</label><br>
                        <input class="input" id="contactlogin" type="number">
                    </div>

                    <div class="input-group">

                    </div>

                    <button class="btn" id="submitbtn">
                        Sign in
                    </button>

                </form>

            </div>

        </section>


        <!-- ========== Right Section ========== -->
        <section class="right-section">
            <img src="LnF-Illustration.png" height="700" width="500">
        </section>

    </main>


    <!-- ==================== Footer ==================== -->
    <footer class="footer">
        <hr>
        Made with <i></i> for JIITians !!
    </footer>

    <script src="indexjs.js"></script>
</body>
</html>
